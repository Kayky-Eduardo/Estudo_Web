<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>
<body class="container bg-dark text-white">
    <h1 class="text-center my-4">Calculadora</h1>
    <div class="row g-3 mb-4">
        <div class="col-12 col-md-6">
            <input type="number" id="number1" placeholder="Digite o primeiro número" class="form-control">
        </div>
        <div class="col-12 col-md-6">
            <input type="number" id="number2" placeholder="Digite o segundo número" class="form-control">
        </div>
    </div>
    <p id="resultado" class="my-5 text-center fs-5">A resposta vai aparecer aqui</p>

    <div class="row g-2">
        <div class="col-6 col-md-3">
            <button type="button" id="btnSomar" class="btn btn-warning w-100">Somar</button>
        </div>
        <div class="col-6 col-md-3">
            <button type="button" id="btnSubtrair" class="btn btn-warning w-100">Subtrair</button>
        </div>
        <div class="col-6 col-md-3">
            <button type="button" id="btnMultiplicar" class="btn btn-warning w-100">Multiplicar</button>
        </div>
        <div class="col-6 col-md-3">
            <button type="button" id="btnDividir" class="btn btn-warning w-100">Dividir</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
