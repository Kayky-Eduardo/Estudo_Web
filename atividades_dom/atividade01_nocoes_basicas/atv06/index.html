<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Verificador de Palíndromo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>
<body class="bg-dark text-white">
    <main>
        <div class="container">
            <div class="row justify-content-center align-items-center mb-4 ">
                <div class="col-12 col-md-8 my-4">
                    <h1 class="text-center my-4">Verificador de Palíndromo</h1>
                    <input id="texto" placeholder="Digite a tarefa" class="form-control">
                    <button id="btnVerificar" class="mt-4 rounded w-100 btn btn-warning">Verificar</button>
                    <p id="saida" class="mt-4 text-center"></p>
                </div>
            </div>
        </div>
    </main>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>
</html>
