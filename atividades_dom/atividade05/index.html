<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <!--CSS-->
    <link rel="stylesheet" href="css/estilo.css">

    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
        crossorigin="anonymous">
</head>

<body>
    <!--Cabeçalho do Site-->
    <header class="row mt-4 mb-4 text-center">
        <h3>Gestão de Alunos</h3>
    </header>

    <!--Container para o conteúdo-->
    <main class="container">
        <div class="row mt-4 align-items-center mb-3 g-3">
            <h4 class="fw-bold mb-4 mt-3">Cadastro de Aluno</h4>
            <div class="col-md-12 col-xl-12 caixa">
                <label for="input-nome" class="mt-3 mb-2">Nome:</label>
                <input id="input-nome" class="form-control mb-2" type="text" placeholder="Digite o nome do aluno">
                <label for="input-frequencia" class="mt-3 mb-2">Frequência(%):</label>
                <input id="input-frequencia" class="form-control mb-3" type="number" placeholder="Digite a frequência do aluno">
                <label for="input-notas" class="mt-3 mb-2">Notas (4 bimestres, separado por vírgula):</label>
                <input id="input-notas" class="form-control mb-3" type="text" placeholder="Digite as notas do aluno">
                <button id="btn-adicionar" class="w-100 btn btn-primary">Adicionar Aluno</button>
                <p id="resposta-erro"></p>
            </div>
        </div>
        <div class="row mt-3 align-items-center mb-5 g-3">
            <h4 class="fw-bold mb-4">Lista de Aluno</h4>
            <div class="col-md-12 col-xl-12 caixa">
                <table class="table table-bordered">
                    <thead>
                        <th scope="col">Nome</th>
                        <th scope="col">Frequência</th>
                        <th scope="col">Média</th>
                        <th scope="col">Menção</th>
                        <th scope="col">Ações</th>
                    </thead>
                    <tbody class="resultado">
                        <!-- <tr> -->
                            <!-- <th scope="row"></th> -->
                            <!-- td -->
                        <!-- </tr> -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!--Rodapé da página-->
    <footer>
        
    </footer>

    <!--Javascript-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>

    <script src="js/script.js"></script>
</body>

</html>
