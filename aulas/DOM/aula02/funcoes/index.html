<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Área</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>
    <!--Container para o conteúdo-->
    <main>
        <h1>Calculadora de Área de Quadrado</h1>
        <label for="ladoInput">Informe o valor do lado:</label>
        <input placeholder="EX: 5" min="0" step="any" type="text" id="ladoInput">
        <button id="calcularBtn">Calcular Área</button>
        <p id="resultado" class="resultado"></p>  
    </main>

    <!--Javascript-->
    <script src="js/script.js"></script>
</body>

</html>
